name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: collabsphere_ci
      QR_SECRET: ci-only-secret
      AUTH_SECRET: ci-only-auth-secret-not-used-in-production
      AUTH_TRUST_HOST: 'true'
      DEV_AUTH: 'true'
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Seed demo data
        run: node scripts/seed.mjs
      - name: Start app
        run: |
          nohup npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/leaderboard && exit 0; sleep 2; done
          cat next.log; exit 1
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Server log
        if: failure()
        run: cat next.log
